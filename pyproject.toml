[project]
name = "assistente-mestre-dnd"
version = "0.2.1"
description = "Copiloto multimodal para Mestres de D&D 5e: voz, regras com evidência, visão e agentes."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-dotenv>=1.0",
    # LLM
    "google-genai>=1.0",
    # Voz
    "faster-whisper>=1.1",
    "av>=11,<16",  # faster-whisper 1.2 usa metadata_errors, removido no PyAV 16+
    "jiwer>=3.0",
    "edge-tts>=6.1",
    # RAG
    "pypdf>=4.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "torch>=2.7",
    "pypdfium2>=5.15.2",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mestre = "mestre.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mestre"]

# PyTorch com CUDA 12.8 (necessário para GPUs RTX série 50 / Blackwell).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
